name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every package declares engines.node >=24.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build must run first: downstream workspace packages (cli) import
      # @burnmark-io/designer-core, which resolves through `exports` to
      # dist/index.{js,d.ts} — both `typecheck` (TS6059 on the .d.ts) and
      # `test:coverage` (Vite loader) need those artifacts to exist.
      - name: Build
        run: pnpm build

      # Typecheck, lint and formatting don't depend on the Node version; run them once.
      - name: Typecheck
        if: matrix.node == 24
        run: pnpm typecheck

      - name: Lint
        if: matrix.node == 24
        run: pnpm lint

      - name: Format check
        if: matrix.node == 24
        run: pnpm prettier --check "packages/**/*.ts"

      - name: Test with coverage
        if: matrix.node == 24
        run: pnpm test:coverage

      - name: Test
        if: matrix.node != 24
        run: pnpm test

      - name: Upload coverage to Codecov
        if: matrix.node == 24
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: false
